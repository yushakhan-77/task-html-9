<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Board using Table</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      margin: 0;
      font-family: sans-serif;
    }

    
    .ludo-board {
      border-collapse: collapse;
      border: 4px solid #333;
      background-color: #fff;
    }

    
    .ludo-board td {
      width: 32px;
      height: 32px;
      border: 1px solid #777;
      text-align: center;
      vertical-align: middle;
      font-weight: bold;
    }

    
    .green { background-color: #008000; }
    .red { background-color: #de1313; }
    .yellow { background-color: #f7d000; }
    .blue { background-color: #0055ff; }
    .home { background-color: #ff9900; }

    
    .corner-box {
      border: 2px solid #000 !important;
    }

   
    .inner-box {
      background-color: #fff;
      margin: auto;
      width: 70%;
      height: 70%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <table class="ludo-board">
  
    <tr>
      <td colspan="6" rowspan="6" class="green corner-box">
        <div class="inner-box"></div>
      </td>
      <td></td> <td></td> <td></td>
      <!-- Top-Right Yellow Home -->
      <td colspan="6" rowspan="6" class="yellow corner-box">
        <div class="inner-box"></div>
      </td>
    </tr>
    <tr> <td></td> <td class="green"></td> <td></td> </tr>
    <tr> <td></td> <td class="green"></td> <td></td> </tr>
    <tr> <td></td> <td class="green"></td> <td></td> </tr>
    <tr> <td></td> <td class="green"></td> <td></td> </tr>
    <tr> <td></td> <td class="green"></td> <td></td> </tr>

    
    <tr>
      <td></td> <td></td> <td></td> <td></td> <td></td> <td></td>
      <td colspan="3" rowspan="3" class="home">HOME</td>
      <td></td> <td class="yellow"></td> <td class="yellow"></td> <td class="yellow"></td> <td class="yellow"></td> <td class="yellow"></td>
    </tr>
    <tr>
      <td></td> <td class="red"></td> <td class="red"></td> <td class="red"></td> <td class="red"></td> <td class="red"></td>
      <td></td> <td></td> <td></td> <td></td> <td></td> <td></td>
    </tr>
    <tr>
      <td></td> <td></td> <td></td> <td></td> <td></td> <td></td>
      <td></td> <td></td> <td></td> <td></td> <td></td> <td></td>
    </tr>

    
    <tr>
      
      <td colspan="6" rowspan="6" class="red corner-box">
        <div class="inner-box"></div>
      </td>
      <td></td> <td class="blue"></td> <td></td>
      <!-- Bottom-Right Blue Home -->
      <td colspan="6" rowspan="6" class="blue corner-box">
        <div class="inner-box"></div>
      </td>
    </tr>
    <tr> <td></td> <td class="blue"></td> <td></td> </tr>
    <tr> <td></td> <td class="blue"></td> <td></td> </tr>
    <tr> <td></td> <td class="blue"></td> <td></td> </tr>
    <tr> <td></td> <td class="blue"></td> <td></td> </tr>
    <tr> <td></td> <td></td> <td></td> </tr>
  </table>

</body>
</html>-
